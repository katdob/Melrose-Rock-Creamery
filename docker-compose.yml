services:
  # PostgreSQL Database Service
  postgres-db:
    build:
      context: ./PostgreSQL_DB
      dockerfile: Dockerfile
    container_name: postgres-db
    environment:
      POSTGRES_USER: mrc_user
      POSTGRES_PASSWORD: passpass
      POSTGRES_DB: MRC_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrc_user -d MRC_DB"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 5

  # C# .NET Backend Service
  csharp-backend:
    build:
      context: ./Csharp_dotNET_backend
      dockerfile: Dockerfile
    container_name: csharp-backend
    command: ["./wait-for-it.sh"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=MRC_DB;Username=mrc_user;Password=passpass
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - backend-db-network
      - frontend-backend-network
    restart: unless-stopped

  # C# .NET Backend – run all .NET tests after build
  csharp-backend-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: csharp-backend-tests
    working_dir: /src
    volumes:
      - ./CSharp_dotNET_backend:/src
    command: ["dotnet", "test", "Tests/Csharp_dotNET_backend.Tests.csproj"]
    depends_on:
      - csharp-backend

  # React Frontend Service
  react-frontend:
    build:
      context: ./React_frontend
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:
      - "3000:80"
    depends_on:
      - csharp-backend
    networks:
      - frontend-backend-network
    restart: unless-stopped

  # React Frontend – run all Vite tests
  react-frontend-tests:
    build:
      context: ./React_frontend
      dockerfile: Dockerfile.test
    container_name: react-frontend-tests
    command: ["npm", "run", "test:run"]
    networks:
      - frontend-backend-network
    profiles:
      - test

# Networks
networks:
  backend-db-network:
    driver: bridge
    name: backend-db-network
  frontend-backend-network:
    driver: bridge
    name: frontend-backend-network

# Volumes
volumes:
  postgres_data:
    driver: local